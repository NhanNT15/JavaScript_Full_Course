<!doctype html>
<html>
  <head>
    <title>Password Generator</title>
    <link rel="stylesheet" href="Random_Password_Generator.css" />
  </head>
  <body>
    <div id="mainbox">
      <div id="title-container">
        <p>Password Generator</p>
      </div>
      <div id="select-section">
        <input
          id="pass-length"
          type="number"
          placeholder="Password Length"
          min="1"
          value="1"
        />
        <p id="sub-title">Include:</p>
        <input class="selection" id="uppercase" type="checkbox" />
        <label id="uppercase-label" for="uppercase">UpperCase</label>
        <input class="selection" id="lowercase" type="checkbox" />
        <label id="uppercase-label" for="lowercase">LowerCase</label>
        <input class="selection" id="number" type="checkbox" />
        <label id="uppercase-label" for="number">Number</label>
        <input class="selection" id="special-character" type="checkbox" />
        <label id="uppercase-label" for="special-character"
          >Special Character</label
        >
        <button id="submit-button">Generate</button>
      </div>
      <div id="message-box-container">
        <p id="message-box">Please Start</p>
      </div>
    </div>
    <script src="Random_Password_Generator.js"></script>
  </body>
</html>
