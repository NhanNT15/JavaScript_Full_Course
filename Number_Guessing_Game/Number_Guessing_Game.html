<!doctype html>
<html>
  <head>
    <title>Guess Number</title>
    <link rel="stylesheet" href="Number_Guessing_Game.css" />
  </head>
  <body>
    <div class="main-box">
      <div class="title-container">
        <p class="title">GUESS THE NUMBER</p>
      </div>
      <div class="setting-container">
        <div class="min-container">
          <input id="min-input" type="text" placeholder=".Min" />
        </div>
        <div class="max-container">
          <input id="max-input" type="text" placeholder=".Max" />
        </div>
        <div class="generate-button-container">
          <button id="generate-button">Create Number</button>
        </div>
      </div>
      <div class="input-container">
        <input id="ans-input" type="text" placeholder="..." />
        <button id="ans-submit">Check My Answer</button>
      </div>
      <div class="noti-container">
        <p id="noti-output">Please input a number!</p>
      </div>
    </div>
    <script src="Number_Guessing_Game.js"></script>
  </body>
</html>
