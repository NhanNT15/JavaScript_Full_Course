<!doctype html>
<html>
  <head>
    <title>Score Counter</title>
    <link rel="stylesheet" href="Index.css" />
  </head>

  <body>
    <div class="mainbox">
      <div class="title-container">
        <h1 id="title">Score Board</h1>
      </div>
      <div class="main-panel">
        <div class="TeamA-section">
          <div class="subtitle-container">
            <h2>TEAM A</h2>
          </div>
          <div class="number-container">
            <p id="scoreA" class="score">0</p>
          </div>
          <div class="button-section">
            <div class="minus-button-container">
              <button class="minus-button" id="minus-buttonA">-</button>
            </div>

            <div class="reset-button-container">
              <button class="reset-button" id="reset-buttonA">Reset</button>
            </div>
            <div class="plus-button-container">
              <button class="plus-button" id="plus-buttonA">+</button>
            </div>
          </div>
        </div>

        <div class="TeamB-section">
          <div class="subtitle-container">
            <h2>TEAM B</h2>
          </div>
          <div class="number-container">
            <p id="scoreB" class="score">0</p>
          </div>
          <div class="button-section">
            <div class="minus-button-container">
              <button class="minus-button" id="minus-buttonB">-</button>
            </div>
            <div class="reset-button-container">
              <button class="reset-button" id="reset-buttonB">Reset</button>
            </div>
            <div class="plus-button-container">
              <button class="plus-button" id="plus-buttonB">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="Index.js"></script>
  </body>
</html>
